<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Link-a-roo">
  <!-- Toolbar mark: "LR" monogram. The bull logo turns to mud at 16px, so the
       action icon carries the initials instead. -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#B85C38"/>
  <text x="32" y="44.5" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="31" font-weight="700" letter-spacing="-0.5"
        fill="#F7EFE2">LR</text>
</svg>
