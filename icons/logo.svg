<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Link-a-roo">
  <!-- Low-poly bull head under a spinning lasso. Faceted planes mirror the
       rodeo-robot artwork; cyan eyes carry over the robot's visor glow. -->

  <!-- Lasso: spinning loop with a rope trailing off to the right -->
  <ellipse cx="32" cy="11" rx="19.5" ry="5.5" fill="none" stroke="#E8913C" stroke-width="2.6"/>
  <path d="M51 13 q4 3 2.5 7" fill="none" stroke="#E8913C" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Horns: tapered crescents sweeping up and out -->
  <path d="M21 28 C14 28 8 23 4.5 13.5 C9 20 14.5 23 22.5 24 Z" fill="#D8B98A"/>
  <path d="M43 28 C50 28 56 23 59.5 13.5 C55 20 49.5 23 41.5 24 Z" fill="#C4A274"/>

  <!-- Head: four facets split along a centre ridge, light falling from the right -->
  <path d="M17 26 L32 24 L32 37 L15 34 Z" fill="#8B5A2B"/>
  <path d="M32 24 L47 26 L49 34 L32 37 Z" fill="#B8763F"/>
  <path d="M15 34 L32 37 L32 54 L23 46 Z" fill="#6B4423"/>
  <path d="M32 37 L49 34 L41 46 L32 54 Z" fill="#96602F"/>

  <!-- Muzzle highlight -->
  <path d="M27 45 L37 45 L32 54 Z" fill="#C88A4E"/>

  <!-- Eyes -->
  <path d="M23 31 L26 33 L23 35 L20 33 Z" fill="#3ECFCF"/>
  <path d="M41 31 L44 33 L41 35 L38 33 Z" fill="#3ECFCF"/>
</svg>
